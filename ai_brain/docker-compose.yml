services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai_brain_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_brain
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_brain_network

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: ai_brain_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_brain_network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_brain_app
    env_file:
      - environment/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/faiss_indices:/app/data/faiss_indices
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_brain_network
    command: python main.py

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_brain_celery_worker
    env_file:
      - environment/.env.docker
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/faiss_indices:/app/data/faiss_indices
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_brain_network
    command: celery -A celery_app worker --loglevel=info --pool=solo

  # Database Admin UI
  adminer:
    image: adminer:latest
    container_name: ai_brain_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - ai_brain_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai_brain_network:
    driver: bridge
