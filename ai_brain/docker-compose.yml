version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_brain_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_brain
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_brain_network

  adminer:
    image: adminer:latest
    container_name: ai_brain_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - ai_brain_network

volumes:
  postgres_data:
    driver: local

networks:
  ai_brain_network:
    driver: bridge
